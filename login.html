<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gold n Crypto Traders</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-input{width:100%;padding:.8rem;margin:.5rem 0;border-radius:10px;background:#0d1424;color:var(--txt);border:1px solid #2a3554}
    .auth-input:focus{outline:none;border-color:var(--gold)}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-inner">
    <a href="index.html" class="logo">🪙 Gold n Crypto <span>Traders</span></a>
  </div></nav>

  <div class="ticker"><div class="ticker-track" id="gncTickerTrack"><span>Connecting to Binance...</span></div></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Welcome! 👋</h2>
      <p class="muted">Log in or create a free account to unlock all timeframe verdicts.</p>

      <!-- Auth Tabs (auth.js switches these) -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" type="button">Log In</button>
        <button class="auth-tab" id="signupTab" type="button">Sign Up</button>
      </div>

      <!-- Login: email + password ONLY (no OTP) -->
      <div id="loginPane">
        <form id="gncLoginForm" data-redirect="verdict.html">
          <input id="loginEmail" type="email" class="auth-input" placeholder="Email address" autocomplete="email" required>
          <input id="loginPassword" type="password" class="auth-input" placeholder="Password" autocomplete="current-password" required>
          <button class="btn btn-gold" type="submit" style="width:100%">Log In</button>
        </form>
      </div>

      <!-- Signup: name + email + phone + password (no OTP) -->
      <div id="signupPane" style="display:none">
        <form id="gncSignupForm" data-redirect="verdict.html">
          <input id="signupName" type="text" class="auth-input" placeholder="Your name" autocomplete="name" required>
          <input id="signupEmail" type="email" class="auth-input" placeholder="Email address" autocomplete="email" required>
          <input id="signupPhone" type="tel" class="auth-input" placeholder="Mobile number (10 digits)" pattern="[0-9]{10}" autocomplete="tel" required>
          <input id="signupPassword" type="password" class="auth-input" placeholder="Password (min 6 characters)" minlength="6" autocomplete="new-password" required>
          <button class="btn btn-gold" type="submit" style="width:100%">Create Account</button>
        </form>
        <p class="muted small" style="margin-top:.8rem;text-align:center">Accounts are stored on this device. No email verification needed.</p>
      </div>

      <p id="authMsg" style="display:none;margin:.8rem 0 0;font-size:.85rem;font-weight:600;text-align:center"></p>
      <p style="text-align:center;margin-top:.6rem"><a href="index.html" class="muted">← Back to home</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="ticker.js"></script>
</body>
</html>
